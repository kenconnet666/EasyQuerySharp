# CI：每个任务起自己需要的数据库服务容器，跑同一套测试；没有配置连接串的数据库测试会跳过，
# 而 require-dbs 列出的数据库连不上时判失败，防止服务容器没起来时测试被静默跳过。
#
# 分工（见 docs/decisions/0003-testing-and-parity.md）：
#   core      SQLite + MySQL 8.4 + PostgreSQL 17：本地也必测的三个库，按测试项目 / 命名空间拆成并行的几片；进程内的 DuckDB 不需要服务，随这几片一起跑
#   checks    对照表与文档卡片快照，不连库
#   pack      打出 src 下的 NuGet 包与符号包，上传成 artifact，不推送到 nuget.org
#   其余任务  只跑实库测试项目，每个任务一种数据库；本地按需用 infra/dev 的 profile 复现
# 镜像版本与 digest 和 infra/dev/compose.yaml 保持一致。密码只用于 CI 里的临时容器。
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    # 每天北京时间 03:00 跑一遍，发现驱动、镜像或上游环境的漂移
    - cron: '0 19 * * *'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  LIVE_TESTS: tests/EasyQuerySharp.Tests.Live

jobs:
  # 本地也必测的三个库（SQLite、MySQL 8.4、PG 17）：用例最多的 Upstream 项目按命名空间拆成两片并行，其余测试项目（实库套件、生成器、依赖注入）一个任务
  core:
    name: core ${{ matrix.shard.name }} (SQLite, MySQL 8.4, PG 17)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: live + generator + di
            project: tests/EasyQuerySharp.Tests.Live tests/EasyQuerySharp.Tests.Generator tests/EasyQuerySharp.Tests.DependencyInjection
            filter: ''
          - name: upstream queries
            project: tests/EasyQuerySharp.Tests.Upstream
            filter: --filter-namespace "EasyQuerySharp.Tests.Upstream.Queries"
          - name: upstream rest
            project: tests/EasyQuerySharp.Tests.Upstream
            filter: --filter-not-namespace "EasyQuerySharp.Tests.Upstream.Queries"
    services:
      mysql:
        image: mysql:8.4.11@sha256:1f8411cc085d2f2f92060fca926746cbf97f87b76c3008e9741ad62e604c4ffa
        env:
          MYSQL_ROOT_PASSWORD: EqsCi2026Pass
          MYSQL_DATABASE: eqs
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pEqsCi2026Pass --silent"
          --health-interval 3s --health-timeout 3s --health-retries 40 --health-start-period 20s
      postgres:
        image: postgres:17.11-bookworm@sha256:66aafa11cf15800a3c94763f7e11d1e7b2e37e5e84bc4ce027cb6e1e4bfaf4df
        env:
          POSTGRES_PASSWORD: EqsCi2026Pass
          POSTGRES_DB: eqs
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      EQS_MYSQL_CS: Server=127.0.0.1;Port=3306;User ID=root;Password=EqsCi2026Pass;Database=eqs
      EQS_PG_CS: Host=127.0.0.1;Port=5432;Username=postgres;Password=EqsCi2026Pass;Database=eqs
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/dotnet-test
        with:
          require-dbs: sqlite,mysql,pg
          project: ${{ matrix.shard.project }}
          filter: ${{ matrix.shard.filter }}
          report-name: test-results-core-${{ strategy.job-index }}

  # 不连库的检查：对照表与文档卡片
  checks:
    name: checks (parity, docs examples)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build -c Release
      # 对照表必须是最新的，[Upstream] 不能引用不存在或重复的 Java 用例（CI 上没有 Java 仓库，读提交的用例快照）
      - name: Parity check
        run: dotnet run --project tools/ParityTests -c Release --no-build -- --check
      # 文档卡片：在 SQLite 上实跑、各方言渲染的 SQL 快照必须是最新的（改了渲染器就要重新生成并提交快照）
      - name: Docs examples check
        run: dotnet run --project tools/DocsExamples -c Release --no-build -- --check

  # 打包：只打可打包的项目（核心带生成器、依赖注入、二级缓存），版本追加构建号（见 src/Directory.Build.props）；GITHUB_ACTIONS 下按正式构建（ContinuousIntegrationBuild）
  pack:
    name: pack (nupkg, snupkg)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Pack
        run: dotnet pack -c Release -o artifacts/packages -p:CiBuildNumber=${{ github.run_number }}
      # 生成器必须在核心包的 analyzers 目录里，不然使用者的 [Projection] 方法在运行时才报错
      - name: Check package layout
        run: unzip -l artifacts/packages/EasyQuerySharp.[0-9]*.nupkg | grep -F analyzers/dotnet/cs/EasyQuerySharp.Generator.dll
      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/packages
          if-no-files-found: error
          retention-days: 14

  # 生产 PolarDB MySQL 版的内核版本基线：MySQL 方言不能用到 8.0.19+ 的写法
  mysql8018:
    name: MySQL 8.0.18 (PolarDB)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0.18@sha256:e1b0fd480a11e5c37425a2591b6fbd32af886bfc6d6f404bd362be5e50a2e632
        env:
          MYSQL_ROOT_PASSWORD: EqsCi2026Pass
          MYSQL_DATABASE: eqs
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pEqsCi2026Pass --silent"
          --health-interval 3s --health-timeout 3s --health-retries 40 --health-start-period 20s
    env:
      EQS_MYSQL8018_CS: Server=127.0.0.1;Port=3306;User ID=root;Password=EqsCi2026Pass;Database=eqs
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/dotnet-test
        with:
          require-dbs: mysql8018
          project: ${{ env.LIVE_TESTS }}
          report-name: test-results-mysql8018

  mariadb:
    name: MariaDB 11.4
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:11.4.13@sha256:d1891ede5a559f1086f55053bb8cc1569b0298338c4d72d71725a7f74f6ba620
        env:
          MARIADB_ROOT_PASSWORD: EqsCi2026Pass
          MARIADB_DATABASE: eqs
        ports: ['3306:3306']
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 3s --health-timeout 3s --health-retries 40 --health-start-period 20s
    env:
      EQS_MARIADB_CS: Server=127.0.0.1;Port=3306;User ID=root;Password=EqsCi2026Pass;Database=eqs
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/dotnet-test
        with:
          require-dbs: mariadb
          project: ${{ env.LIVE_TESTS }}
          report-name: test-results-mariadb

  # SQL Server：live 套件与 Upstream 的 mssql 用例（库 mssql_eq）拆成两片并行
  mssql:
    name: SQL Server 2022 ${{ matrix.shard.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: live
            project: tests/EasyQuerySharp.Tests.Live
            filter: ''
          - name: upstream
            project: tests/EasyQuerySharp.Tests.Upstream
            filter: --filter-namespace "EasyQuerySharp.Tests.Upstream.Mssql"
    services:
      mssql:
        # 2022 CU27（16.0.4305.5）
        image: mcr.microsoft.com/mssql/server:2022-latest@sha256:cf8f0ab2ebe61feec2eed2629061a07d247f791c2a8ddda74a4ac9f06a291718
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_PID: Developer
          # 满足复杂度要求（大写、小写、数字），不含符号以免在 health-cmd 里转义
          MSSQL_SA_PASSWORD: EqsCi2026Pass
        ports: ['1433:1433']
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P EqsCi2026Pass -Q 'SELECT 1' -b -o /dev/null"
          --health-interval 5s --health-timeout 5s --health-retries 60 --health-start-period 30s
    env:
      EQS_MSSQL_CS: Server=127.0.0.1,1433;User ID=sa;Password=EqsCi2026Pass;TrustServerCertificate=True;Initial Catalog=master
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/dotnet-test
        with:
          require-dbs: mssql
          project: ${{ matrix.shard.project }}
          filter: ${{ matrix.shard.filter }}
          report-name: test-results-mssql-${{ strategy.job-index }}

  oracle:
    name: Oracle 23ai Free
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      oracle:
        image: gvenzl/oracle-free:23-slim@sha256:6d61d267a3b978c24c5ac1790e62e927416a0aec446bd86e4b3a1527562757bd
        env:
          ORACLE_PASSWORD: EqsCi2026Pass
          APP_USER: eqs
          APP_USER_PASSWORD: EqsCi2026Pass
        ports: ['1521:1521']
        options: >-
          --health-cmd healthcheck.sh
          --health-interval 5s --health-timeout 5s --health-retries 120 --health-start-period 60s
    env:
      EQS_ORACLE_CS: User Id=eqs;Password=EqsCi2026Pass;Data Source=127.0.0.1:1521/FREEPDB1
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/dotnet-test
        with:
          require-dbs: oracle
          project: ${{ env.LIVE_TESTS }}
          report-name: test-results-oracle

  # 达梦 DM8（第二档冒烟）：实库套件，与 Upstream 里连实库的达梦行锁用例（模式 EQS_UPSTREAM）拆成两片并行
  dameng:
    name: Dameng DM8 ${{ matrix.shard.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: live
            project: tests/EasyQuerySharp.Tests.Live
            filter: ''
          - name: upstream
            project: tests/EasyQuerySharp.Tests.Upstream
            filter: --filter-namespace "EasyQuerySharp.Tests.Upstream.Dameng"
    services:
      dameng:
        image: xuxuclassmate/dameng:latest@sha256:c4088323442747a45d58bd33ef59e657c9b85f9e7dd956ba60b36d04a35b141d
        env:
          SYSDBA_PWD: EqsCi2026Pass
          UNICODE_FLAG: 1
          LENGTH_IN_CHAR: 1
          CASE_SENSITIVE: 1
          TZ: Asia/Shanghai
        ports: ['5236:5236']
        options: >-
          --health-cmd "cd /opt/dmdbms/bin && ./disql -L -S SYSDBA/EqsCi2026Pass@127.0.0.1:5236 -e 'SELECT 1' < /dev/null"
          --health-interval 5s --health-timeout 10s --health-retries 60 --health-start-period 20s
    env:
      EQS_DAMENG_CS: Server=127.0.0.1;Port=5236;User Id=SYSDBA;PWD=EqsCi2026Pass
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/dotnet-test
        with:
          require-dbs: dameng
          project: ${{ matrix.shard.project }}
          filter: ${{ matrix.shard.filter }}
          report-name: test-results-dameng-${{ strategy.job-index }}

  # openGauss 7（第二档冒烟，PG 协议，驱动用 Npgsql）：只跑实库套件
  opengauss:
    name: openGauss 7
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      opengauss:
        image: opengauss/opengauss-server:latest@sha256:d554be1b8b08165a8b19348f0ca236b5d61a4832ffadac0340ded973c34f38e4
        env:
          # openGauss 要求带 #?!@$%^&*- 之一的符号
          GS_PASSWORD: EqsCi2026Pass@
          TZ: Asia/Shanghai
        ports: ['5432:5432']
        options: >-
          --privileged
          --health-cmd "echo 'SELECT 1' | su - omm -c 'gsql -d postgres -v ON_ERROR_STOP=1'"
          --health-interval 5s --health-timeout 10s --health-retries 60 --health-start-period 30s
    env:
      EQS_OPENGAUSS_CS: Host=127.0.0.1;Port=5432;Username=gaussdb;Password=EqsCi2026Pass@;Database=postgres
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/dotnet-test
        with:
          require-dbs: opengauss
          project: ${{ env.LIVE_TESTS }}
          report-name: test-results-opengauss


  # SAP HANA Express 2.0。镜像要自建（infra/dev/hana：启动时接受 SAP 开发者许可、裁掉测试用不到的服务），不能当服务容器，
  # 用 infra/dev 的 compose 起，内存上限只在 compose 里写一处（runner 有 16 GB）。首次启动要初始化库，约 8 分钟，与客户端下载、构建并行。
  # ADO.NET 驱动随 HANA 客户端发布、不在 nuget.org：从 SAP Development Tools 下载固定版本的 Linux 客户端（同样接受 SAP 开发者许可），按版本缓存，
  # 用 EQS_HANA_DRIVER 指给 TestKit 在运行时加载。Upstream 项目里只有 fork 的 HANA 用例连库，其余用例与 core 任务重复但不连库，开销不大。
  hana:
    name: SAP HANA Express 2.0
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      # 16-64 位字母数字，含大小写与数字（infra/dev/hana/start.sh 校验）
      EQS_DEV_HANA_PASSWORD: EqsCi2026Pass0Hana
      EQS_HANA_CS: Server=127.0.0.1:49041;UserName=SYSTEM;Password=EqsCi2026Pass0Hana
      HANA_CLIENT_VERSION: 2.30.27
      EQS_HANA_DRIVER: ${{ github.workspace }}/.hdbclient/dotnetcore
    steps:
      - uses: actions/checkout@v7
      - name: Start HANA Express
        # compose 会对整个文件做变量替换，其余服务的密码变量也要有值（这些服务不会启动）
        run: |
          grep -o 'EQS_DEV_[A-Z0-9]*_PASSWORD' infra/dev/compose.yaml | sort -u | sed "s/$/=$EQS_DEV_HANA_PASSWORD/" > "$RUNNER_TEMP/db.env"
          docker compose -f infra/dev/compose.yaml --env-file "$RUNNER_TEMP/db.env" --profile hana up -d --build hana
      - name: Cache HANA client
        id: hana-client
        uses: actions/cache@v6
        with:
          path: .hdbclient
          key: hanaclient-${{ env.HANA_CLIENT_VERSION }}-linux-x64
      - name: Install HANA client
        if: steps.hana-client.outputs.cache-hit != 'true'
        run: |
          download=$(mktemp -d)
          curl -fsSL --retry 3 --cookie 'eula_3_2_agreed=tools.hana.ondemand.com/developer-license-3_2.txt' \
            -o "$download/hanaclient.tar.gz" "https://tools.hana.ondemand.com/additional/hanaclient-${HANA_CLIENT_VERSION}-linux-x64.tar.gz"
          tar -xzf "$download/hanaclient.tar.gz" -C "$download"
          # 安装程序在包的根目录或 client/ 下
          installer=$(find "$download" -maxdepth 2 -type f -name hdbinst | head -n 1)
          "$installer" --batch --path="$GITHUB_WORKSPACE/.hdbclient"
          ls "$EQS_HANA_DRIVER"/v10.0/Sap.Data.Hana.Net.v10.0.dll
      - name: Wait for HANA
        run: |
          container=$(docker compose -f infra/dev/compose.yaml --env-file "$RUNNER_TEMP/db.env" --profile hana ps -q hana)
          for _ in $(seq 1 120); do
            status=$(docker inspect -f '{{.State.Health.Status}}' "$container")
            if [[ $status == healthy ]]; then docker stats --no-stream "$container"; exit 0; fi
            sleep 10
          done
          docker logs --tail 200 "$container"
          exit 1
      - uses: ./.github/actions/dotnet-test
        with:
          require-dbs: hana
          project: tests/EasyQuerySharp.Tests.Live tests/EasyQuerySharp.Tests.Upstream
          report-name: test-results-hana

  # ClickHouse：ClickHouseLiveSuite（主键由应用给值的分析型冒烟）；连接串里的会话设置由套件自己追加
  clickhouse:
    name: ClickHouse 25.8
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:25.8@sha256:0152dd511befe6a2c2ef53e930726179669b08116da78500b37c51c96ff5ee77
        env:
          CLICKHOUSE_USER: eqs
          CLICKHOUSE_PASSWORD: EqsCi2026Pass
          CLICKHOUSE_DB: eqs
        ports: ['8123:8123']
        options: >-
          --ulimit nofile=262144:262144
          --health-cmd "wget -qO- http://127.0.0.1:8123/ping"
          --health-interval 3s --health-timeout 3s --health-retries 40
    env:
      EQS_CLICKHOUSE_CS: Host=127.0.0.1;Port=8123;Username=eqs;Password=EqsCi2026Pass;Database=eqs
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/dotnet-test
        with:
          require-dbs: clickhouse
          project: ${{ env.LIVE_TESTS }}
          report-name: test-results-clickhouse

  # TDengine：TDengineLiveSuite（时间戳主键的冒烟）走 taosAdapter 的 WebSocket，不用装客户端；账号是镜像默认的 root / taosdata
  tdengine:
    name: TDengine 3.3
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      tdengine:
        image: tdengine/tdengine:3.3.6.13@sha256:79d32ce8a42f64c7dbfc33946a36b3e176ea23c0cd695a1bc9e8aa889ca03b88
        env:
          TZ: UTC
        ports: ['6041:6041']
        options: >-
          --health-cmd "bash -c 'echo > /dev/tcp/127.0.0.1/6041'"
          --health-interval 3s --health-timeout 3s --health-retries 60
    env:
      EQS_TDENGINE_CS: protocol=WebSocket;host=127.0.0.1;port=6041;username=root;password=taosdata
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/dotnet-test
        with:
          require-dbs: tdengine
          project: ${{ env.LIVE_TESTS }}
          report-name: test-results-tdengine

  # Db2 12.1（镜像 6.7 GB、要 privileged，首次建库几分钟）：服务容器不能等日志里的 "Setup has completed"，改用 docker run 后轮询日志。
  # Linux 上的驱动是 Net.IBM.Data.Db2-lnx（TestKit 按操作系统引用），自带的 CLI 原生库在输出目录的 clidriver/lib，依赖 libxml2
  db2:
    name: Db2 12.1
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      EQS_DB2_CS: Server=127.0.0.1:50000;Database=eqs;UID=db2inst1;PWD=EqsCi2026Pass
      LD_LIBRARY_PATH: ${{ github.workspace }}/tests/EasyQuerySharp.Tests.Live/bin/Release/net10.0/clidriver/lib
    steps:
      - name: Start Db2
        run: >-
          docker run -d --name db2 --privileged -p 50000:50000 -e LICENSE=accept -e DB2INST1_PASSWORD=EqsCi2026Pass
          -e DBNAME=eqs -e ARCHIVE_LOGS=false -e AUTOCONFIG=false
          icr.io/db2_community/db2:12.1.2.0@sha256:9cc0d21df5d86cd9a5ce1c65c390dc10d56b1d38ab6e992c8a08eda677368781
      - uses: actions/checkout@v7
      - run: sudo apt-get install -y --no-install-recommends libxml2
      - name: Wait for Db2
        run: timeout 1200 bash -c 'until docker logs db2 2>&1 | grep -q "Setup has completed"; do sleep 10; done'
      - uses: ./.github/actions/dotnet-test
        with:
          require-dbs: db2
          project: ${{ env.LIVE_TESTS }}
          report-name: test-results-db2
